AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudFormation template that creates an EC2 instance,
  S3 Bucket, IAM Role and Security Group.

Parameters:

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: Red-Login

Resources:

########################################
# S3 Bucket
########################################

  DemoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: schoolville22-demo-bucket

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

########################################
# IAM Role
########################################

  EC2Role:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: S3ReadWrite

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                Resource:

                  - !Sub arn:aws:s3:::${DemoBucket}/*
                  - !Sub arn:aws:s3:::${DemoBucket}

########################################
# Instance Profile
########################################

  EC2InstanceProfile:

    Type: AWS::IAM::InstanceProfile

    Properties:

      Roles:

        - !Ref EC2Role

########################################
# Security Group
########################################

  InstanceSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Allow SSH and HTTP

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 22

          ToPort: 22

          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp

          FromPort: 80

          ToPort: 80

          CidrIp: 0.0.0.0/0

########################################
# EC2 Instance
########################################

  EC2Instance:

    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      KeyName: !Ref KeyPairName

      ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/26.04/stable/current/amd64/hvm/ebs-gp3/ami-id

      SecurityGroups:

        - !Ref InstanceSecurityGroup

      IamInstanceProfile: !Ref EC2InstanceProfile

      Tags:

        - Key: Name

          Value: MyServer

      UserData:

        Fn::Base64: |

          #!/bin/bash

          apt update -y

          apt install apache2 -y

          systemctl enable apache2

          systemctl start apache2

          echo "<h1>Apache Installed Successfully</h1>" > /var/www/html/index.html

########################################
# Outputs
########################################

Outputs:

  InstancePublicIP:

    Description: Public IP

    Value: !GetAtt EC2Instance.PublicIp

  InstancePublicDNS:

    Description: Public DNS

    Value: !GetAtt EC2Instance.PublicDnsName

  BucketName:

    Description: Bucket Name

    Value: !Ref DemoBucket